name: Test home sensor calibration buttons on Android emulator
on:
  push:
    branches: [feature/dr-dual-track-spoof-guard]
  workflow_dispatch:
jobs:
  sensor-buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test three sensor buttons and contextual calibration help
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ua.obdgps.nav.MainSensorCardsInstrumentedTest
      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensor-cards-android-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore

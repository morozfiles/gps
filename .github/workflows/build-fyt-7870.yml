name: Build dedicated FYT 7870 landscape APK
on:
  push:
    branches: ['feature/fyt-7870-headunit']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare permanent certificate
        env:
          OBDGPS_KEYSTORE_B64: ${{ secrets.OBDGPS_KEYSTORE_B64 }}
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        run: |
          test -n "$OBDGPS_KEYSTORE_B64"
          test -n "$OBDGPS_SIGNING_PASSWORD"
          umask 077
          printf '%s' "$OBDGPS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/obdgps-signing.p12"
          test -s "$RUNNER_TEMP/obdgps-signing.p12"
          echo "OBDGPS_SIGNING_STORE_FILE=$RUNNER_TEMP/obdgps-signing.p12" >> "$GITHUB_ENV"
      - name: Run JVM navigation and sensor tests
        env:
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build dedicated head-unit APK
        env:
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify FYT application ID and stable signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 12
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -q "package: name='ua.obdgps.nav.fyt7870'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -q "launchable-activity: name='ua.obdgps.nav.FytHeadUnitActivity'"
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERT"
          echo "$CERT" | grep -Fiq "Signer #1 certificate SHA-256 digest: 0f97878527a8c268705c3bebbf4570d78034dc26159edb56d78743cfd202784e"
      - uses: actions/upload-artifact@v4
        with:
          name: FYT-7870-OBD-GPS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

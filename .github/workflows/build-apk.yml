name: Build Android debug APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare permanent APK signing key
        env:
          OBDGPS_KEYSTORE_B64: ${{ secrets.OBDGPS_KEYSTORE_B64 }}
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$OBDGPS_KEYSTORE_B64" ] && [ -z "$OBDGPS_SIGNING_PASSWORD" ]; then
            echo "::warning title=Temporary APK signing::No permanent signing secrets. This APK cannot update a build signed on a different CI runner."
            echo "PERMANENT_SIGNING=false" >> "$GITHUB_ENV"
          elif [ -z "$OBDGPS_KEYSTORE_B64" ] || [ -z "$OBDGPS_SIGNING_PASSWORD" ]; then
            echo "::error title=Signing configuration incomplete::Set both OBDGPS_KEYSTORE_B64 and OBDGPS_SIGNING_PASSWORD."
            exit 1
          else
            umask 077
            printf '%s' "$OBDGPS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/obdgps-signing.p12"
            test -s "$RUNNER_TEMP/obdgps-signing.p12"
            echo "OBDGPS_SIGNING_STORE_FILE=$RUNNER_TEMP/obdgps-signing.p12" >> "$GITHUB_ENV"
            echo "PERMANENT_SIGNING=true" >> "$GITHUB_ENV"
            echo "Permanent APK signing key loaded from GitHub Actions secrets."
          fi
      - name: Build debug APK
        env:
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          signed_info=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$signed_info"
          if [ "$PERMANENT_SIGNING" = "true" ]; then
            # Non-secret public fingerprint of the newly generated permanent
            # certificate. Refuse an accidental different signing key.
            expected="0f97878527a8c268705c3bebbf4570d78034dc26159edb56d78743cfd202784e"
            if ! printf '%s\n' "$signed_info" | grep -Fiq "Signer #1 certificate SHA-256 digest: $expected"; then
              echo "::error title=Wrong app signing key::This keystore is not the expected permanent signing identity."
              exit 1
            fi
            echo "Verified the permanent signing certificate fingerprint."
          else
            echo "::warning title=One-off signing certificate::Installable APK, but not a compatible in-place update of earlier CI builds."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OBD-GPS-Navigator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build FYT7870 Google APK
on:
  push:
    branches: [fyt7870-google, 'feature/fyt-one-shot-crash-diagnostics']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare permanent APK signing key
        env:
          OBDGPS_KEYSTORE_B64: ${{ secrets.OBDGPS_KEYSTORE_B64 }}
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        shell: bash
        run: |
          # Never produce an APK artifact signed with an ephemeral debug key.
          # An APK without the stable signer cannot update the installed app
          # while preserving private ML training, maps and user settings.
          if [ -z "$OBDGPS_KEYSTORE_B64" ] || [ -z "$OBDGPS_SIGNING_PASSWORD" ]; then
            echo "::error title=Permanent APK signing required::Add BOTH OBDGPS_KEYSTORE_B64 and OBDGPS_SIGNING_PASSWORD in GitHub Settings > Secrets and variables > Actions. Unsigned-by-stable-key APK publishing is disabled to protect installed app data."
            exit 1
          fi
          umask 077
          printf '%s' "$OBDGPS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/obdgps-signing.p12"
          test -s "$RUNNER_TEMP/obdgps-signing.p12"
          echo "OBDGPS_SIGNING_STORE_FILE=$RUNNER_TEMP/obdgps-signing.p12" >> "$GITHUB_ENV"
          echo "PERMANENT_SIGNING=true" >> "$GITHUB_ENV"
          echo "Permanent APK signing key loaded from GitHub Actions secrets."
      - name: Run vector map projection regression tests
        env:
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Check Google Maps credentials configured
        shell: bash
        env:
          GOOGLE_MAPS_FYT7870_KEY: ${{ secrets.GOOGLE_MAPS_FYT7870_KEY }}
          GOOGLE_ROUTES_FYT7870_KEY: ${{ secrets.GOOGLE_ROUTES_FYT7870_KEY }}
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_FYT7870_KEY" ] && [ -z "$GOOGLE_MAPS_ANDROID_KEY" ]; then
            echo "::error title=Google Maps key missing::Provide GOOGLE_MAPS_FYT7870_KEY or GOOGLE_MAPS_ANDROID_KEY."
            exit 1
          fi
          if [ -z "$GOOGLE_ROUTES_FYT7870_KEY" ] && [ -z "$GOOGLE_ROUTES_API_KEY" ]; then
            echo "::error title=Google Routes key missing::Provide GOOGLE_ROUTES_FYT7870_KEY or GOOGLE_ROUTES_API_KEY."
            exit 1
          fi
          if [ -z "$GOOGLE_MAPS_FYT7870_KEY" ]; then
            echo "::warning title=FYT Google Maps key::Using PHONE key. Google Cloud must allowlist the FYT application ID and APK signer."
          fi
          if [ -z "$GOOGLE_ROUTES_FYT7870_KEY" ]; then
            echo "::warning title=FYT Google Routes key::Using PHONE key. Restriction must allowlist the FYT application."
          fi
          echo "Google credentials present; key values hidden."
      - name: Build debug APK
        env:
          OBDGPS_SIGNING_PASSWORD: ${{ secrets.OBDGPS_SIGNING_PASSWORD }}
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
          GOOGLE_MAPS_FYT7870_KEY: ${{ secrets.GOOGLE_MAPS_FYT7870_KEY }}
          GOOGLE_ROUTES_FYT7870_KEY: ${{ secrets.GOOGLE_ROUTES_FYT7870_KEY }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify FYT package ID
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='ua.obdgps.nav.fyt7870'"

      - name: Verify APK signature
        shell: bash
        run: |
          signed_info=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$signed_info"
          # Hard requirement: even a successfully compiled APK must not
          # be published unless it matches the one permanent certificate.
          expected="0f97878527a8c268705c3bebbf4570d78034dc26159edb56d78743cfd202784e"
          if ! printf '%s\n' "$signed_info" | grep -Fiq "Signer #1 certificate SHA-256 digest: $expected"; then
            echo "::error title=Wrong app signing key::Refusing to publish APK signed with a different certificate."
            exit 1
          fi
          echo "Verified the permanent signing certificate fingerprint."
      - uses: actions/upload-artifact@v4
        with:
          name: FYT7870-GOOGLE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
